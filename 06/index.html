<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Orbit — Secure system</title>
  <script>
    const LILY_FRONT = "assets/car-a.webp";
    const LILY_REVEAL = "assets/car-b.webp";
  </script>
  <style>
    :root{
      --ink:#161616;
      --surface:#ffffff;
      --orb-reveal:cubic-bezier(.16,1,.3,1);
      --orb-soft:cubic-bezier(.25,.8,.28,1);
    }
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffffff}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .viewport{position:fixed;inset:0;background:var(--surface)}
    .stage{position:absolute;inset:0;contain:strict;isolation:isolate;overflow:hidden}

    /* Brand mark */
    .brand-mark{position:absolute;z-index:4;top:2.141745dvh;left:3.854167vw;width:clamp(34px,min(3.4375vw,5.2dvh),66px);height:auto;fill:none;stroke:var(--ink);stroke-width:5px;stroke-linecap:square}

    /* Primary nav */
    .primary-nav{position:absolute;inset:0;z-index:4;margin:0;padding:0;list-style:none;pointer-events:none}
    .primary-nav li{position:absolute;top:3.426791dvh;transform-origin:left top;white-space:nowrap}
    .primary-nav li:nth-child(1){left:10.104167vw;transform:scaleX(1.165)}
    .primary-nav li:nth-child(2){left:17.526042vw;transform:scaleX(1.052)}
    .primary-nav li:nth-child(3){left:27.578125vw;transform:scaleX(1.126)}
    .primary-nav li:nth-child(4){left:36.171875vw;transform:scaleX(1.168)}
    .primary-nav a{display:inline-block;pointer-events:auto;color:var(--ink);text-decoration:none;font-size:clamp(13px,min(1.302083vw,2.05dvh),25px);line-height:1.2}

    /* Pill */
    .pill{position:absolute;z-index:4;top:2.336449dvh;right:7.5vw;height:clamp(34px,4.439252dvh,57px);display:inline-flex;align-items:center;padding:0 1.45em;border-radius:999px;background:#161616;color:#fff;text-decoration:none;font-size:clamp(12px,min(1.09375vw,1.75dvh),21px);letter-spacing:.026923em;white-space:nowrap}

    /* Wordmark */
    .orbit-word{position:absolute;z-index:1;top:11.565421dvh;left:0;width:100%;text-align:center;text-indent:-.02em;box-sizing:border-box;margin:0;font-family:"Times New Roman",Times,serif;font-weight:400;font-size:min(24vw,55dvh);line-height:1;letter-spacing:.033708em;white-space:nowrap}
    .orbit-word__mask{display:block}
    .orbit-word__inner{display:inline-block}
    .orbit-word__white{color:#161616}
    .orbit-word__o{display:inline-block;transform:scaleX(1.0866);transform-origin:left center;margin-right:.042135em}
    .orbit-word__pink{background:linear-gradient(180deg,#ffc5dc 0%,#fd86db 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

    /* Flower */
    .flower{position:absolute;z-index:2;top:38dvh;left:50%;width:min(62vw,125dvh);transform:translateX(-50%);pointer-events:none}
    .flower__sizer{display:block;width:100%;height:auto;visibility:hidden}
    .flower__layer{position:absolute;inset:0}
    .flower__layer img{display:block;width:100%;height:100%;object-fit:cover}
    .flower__layer--top{-webkit-mask-image:linear-gradient(#0000,#0000);mask-image:linear-gradient(#0000,#0000)}
    .flower.is-fallback{height:calc(min(62vw,125dvh) / 2.6)}
    .flower.is-fallback img{visibility:hidden}
    .flower.is-fallback .flower__layer--bg{background:rgba(253,134,219,.35)}
    .flower.is-fallback .flower__layer--top{background:rgba(255,197,220,.7)}

    /* Corner copy */
    .support-copy{position:absolute;z-index:3;bottom:4.361371dvh;margin:0;color:#161616;font-size:clamp(14px,min(1.40625vw,2.102804dvh),27px);line-height:1.25;white-space:nowrap;transform-origin:left bottom}
    .support-copy--left{left:3.177083vw;transform:scaleX(1.073)}
    .support-copy--right{left:78.28125vw;transform:scaleX(1.058)}
    .support-copy__inner{display:block}

    /* Mobile chrome */
    .burger,.scrim,.sheet{display:none}
    .burger{position:absolute;z-index:12;top:2.141745dvh;right:4.5vw;width:48px;height:48px;padding:0;border:1px solid rgba(22,22,22,.15);border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14);cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px}
    .burger span{display:block;width:18px;height:2px;background:#161616;transition:transform .3s var(--orb-soft),opacity .3s}
    .is-open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .is-open .burger span:nth-child(2){opacity:0}
    .is-open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .scrim{position:absolute;inset:0;z-index:9;border:0;padding:0;background:rgba(22,22,22,.32);opacity:0;pointer-events:none;transition:opacity .3s}
    .is-open .scrim{opacity:1;pointer-events:auto}
    .sheet{position:absolute;z-index:10;top:0;right:0;height:100%;width:min(78vw,360px);padding:14dvh 8vw 0;box-sizing:border-box;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-left:1px solid rgba(22,22,22,.08);transform:translateX(100%);transition:transform .42s var(--orb-reveal)}
    .is-open .sheet{transform:translateX(0)}
    .sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.4em}
    .sheet a{color:#161616;text-decoration:none;font-size:clamp(22px,6vw,32px)}

    @media (max-width:900px),(max-aspect-ratio:4/5){
      .pill,.primary-nav{display:none}
      .burger{display:flex}
      .scrim,.sheet{display:block}
    }
    @media (max-aspect-ratio:4/5){
      .flower{left:50%;top:32dvh;width:min(96vw,140dvh)}
      .flower.is-fallback{height:calc(min(96vw,140dvh) / 2.6)}
      .orbit-word{font-size:min(27.5vw,18dvh)}
      .support-copy{white-space:normal;max-width:42vw}
      .support-copy--right{left:auto;right:3.177083vw;text-align:right;transform-origin:right bottom}
    }

    /* Entrance */
    @keyframes orb-word{from{transform:translateY(118%)}to{transform:translateY(0)}}
    @keyframes orb-subject{from{opacity:0;transform:translateX(-50%) translateY(3.4dvh)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes orb-corner{from{opacity:0;transform:translateY(1.4dvh)}to{opacity:1;transform:translateY(0)}}
    @keyframes orb-quiet{from{opacity:0;transform:translateY(.9dvh)}to{opacity:1;transform:translateY(0)}}
    @keyframes orb-dim{from{opacity:0}to{opacity:1}}
    html.anim .brand-mark{animation:orb-quiet 620ms var(--orb-soft) 100ms both}
    html.anim .primary-nav li:nth-child(1) a{animation:orb-dim 550ms var(--orb-soft) 180ms both}
    html.anim .primary-nav li:nth-child(2) a{animation:orb-dim 550ms var(--orb-soft) 225ms both}
    html.anim .primary-nav li:nth-child(3) a{animation:orb-dim 550ms var(--orb-soft) 270ms both}
    html.anim .primary-nav li:nth-child(4) a{animation:orb-dim 550ms var(--orb-soft) 315ms both}
    html.anim .pill{animation:orb-quiet 620ms var(--orb-soft) 340ms both}
    html.anim .orbit-word__mask{overflow:hidden;padding:.25em 0 .12em;margin:-.25em 0 -.12em}
    html.anim .orbit-word__inner{animation:orb-word 1150ms var(--orb-reveal) 300ms both}
    html.anim .flower{animation:orb-subject 1150ms var(--orb-reveal) 660ms both}
    html.anim .support-copy__inner{animation:orb-corner 720ms var(--orb-soft) 980ms both}
    @media (max-width:900px),(max-aspect-ratio:4/5){
      html.anim .burger{animation:orb-quiet 620ms var(--orb-soft) 220ms both}
      html.anim .orbit-word__inner{animation-delay:240ms}
      html.anim .flower{animation-delay:540ms}
      html.anim .support-copy__inner{animation-delay:820ms}
    }
    @media (prefers-reduced-motion:reduce){
      html.anim .brand-mark,html.anim .primary-nav a,html.anim .pill,html.anim .orbit-word__inner,html.anim .flower,html.anim .support-copy__inner,html.anim .burger{animation:none}
      html.anim .orbit-word__mask{overflow:visible;padding:0;margin:0}
      html.anim .stage{animation:orb-dim 280ms linear both}
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage" id="stage">

      <svg class="brand-mark" viewBox="0 0 66 62" role="img" aria-label="Orbit">
        <line x1="33" y1="1" x2="33" y2="61"></line>
        <line x1="3" y1="31" x2="63" y2="31"></line>
        <line x1="11.8" y1="9.8" x2="54.2" y2="52.2"></line>
        <line x1="54.2" y1="9.8" x2="11.8" y2="52.2"></line>
      </svg>

      <ul class="primary-nav" aria-label="Primary">
        <li><a href="#home">Home</a></li>
        <li><a href="#resources">Resources</a></li>
        <li><a href="#benefits">Benefits</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <a class="pill" href="#secure">Secure system</a>

      <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span>
            <span class="orbit-word__pink">BIT</span>
          </span>
        </span>
      </h1>

      <div class="flower" id="flower">
        <img class="flower__sizer" data-lily="front" alt="" aria-hidden="true">
        <div class="flower__layer flower__layer--bg" id="layer-bg">
          <img data-lily="front" alt="Sketched black Porsche SUV, side view">
        </div>
        <div class="flower__layer flower__layer--top" id="layer-top" aria-hidden="true">
          <img data-lily="reveal" alt="">
        </div>
      </div>

      <p class="support-copy support-copy--left"><span class="support-copy__inner">Every workflow,<br>intelligently connected.</span></p>
      <p class="support-copy support-copy--right"><span class="support-copy__inner">Less manual work.<br>More meaningful output.</span></p>

      <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sheet"><span></span><span></span><span></span></button>
      <button class="scrim" id="scrim" type="button" aria-label="Close menu" tabindex="-1"></button>
      <nav class="sheet" id="sheet" aria-label="Menu" inert>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#resources">Resources</a></li>
          <li><a href="#benefits">Benefits</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

    </section>
  </main>

  <script>
  (() => {
    /* Images from constants only */
    const flower = document.getElementById('flower');
    document.querySelectorAll('img[data-lily]').forEach(img => {
      img.addEventListener('error', () => flower.classList.add('is-fallback'), { once: true });
      img.src = img.dataset.lily === 'front' ? LILY_FRONT : LILY_REVEAL;
    });

    /* Entrance: remove .anim after last orb-* animation */
    const root = document.documentElement;
    let animDone = false;
    const finishAnim = () => { if (animDone) return; animDone = true; root.classList.remove('anim'); };
    requestAnimationFrame(() => {
      const anims = document.getAnimations().filter(a => a.animationName && a.animationName.startsWith('orb-'));
      if (!anims.length) { finishAnim(); return; }
      Promise.all(anims.map(a => a.finished)).then(finishAnim, finishAnim);
    });
    setTimeout(finishAnim, 6000);

    /* Morph-reveal trail */
    const TRAIL_MAX_POINTS = 60, TRAIL_HEAD_R = 140, TRAIL_NOISE_AMP = 44, TRAIL_BLOB_PTS = 24,
          TRAIL_FADE_SPEED = 0.92, TRAIL_SAMPLE_DIST = 8;
    const CANVAS_SCALE = 0.5;

    function drawMorphBlob(ctx, cx, cy, r, t, seed, s) {
      if (r < 2) return;
      const pts = [];
      for (let i = 0; i < TRAIL_BLOB_PTS; i++) {
        const angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
        const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
        const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
        const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
        const noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
        const rr = (r + noise) * s;
        pts.push({ x: cx * s + Math.cos(angle) * rr, y: cy * s + Math.sin(angle) * rr });
      }
      ctx.beginPath();
      const n = pts.length;
      let m = { x: (pts[0].x + pts[n - 1].x) / 2, y: (pts[0].y + pts[n - 1].y) / 2 };
      ctx.moveTo(m.x, m.y);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        const mid = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
        ctx.quadraticCurveTo(p.x, p.y, mid.x, mid.y);
      }
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    class MorphTrailLayer {
      constructor(el, invert) {
        this.el = el; this.invert = invert;
        this.canvas = document.createElement('canvas');
        this.canvas.style.display = 'none';
        document.body.appendChild(this.canvas);
        this.ctx = this.canvas.getContext('2d');
      }
      resize(w, h) {
        this.canvas.width = Math.max(1, Math.round(w * CANVAS_SCALE));
        this.canvas.height = Math.max(1, Math.round(h * CANVAS_SCALE));
      }
      render(points, head, time) {
        const { ctx, canvas } = this;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!this.invert) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.globalCompositeOperation = 'destination-out';
        }
        for (const p of points) {
          ctx.globalAlpha = p.alpha;
          drawMorphBlob(ctx, p.x, p.y, p.r, time, p.seed, CANVAS_SCALE);
        }
        if (head) { ctx.globalAlpha = 1; drawMorphBlob(ctx, head.x, head.y, head.r, time, head.seed, CANVAS_SCALE); }
        ctx.globalAlpha = 1;
        const url = `url(${canvas.toDataURL()})`;
        const st = this.el.style;
        st.webkitMaskImage = st.maskImage = url;
        st.webkitMaskSize = st.maskSize = '100% 100%';
        st.webkitMaskRepeat = st.maskRepeat = 'no-repeat';
      }
      idle() {
        const st = this.el.style;
        const v = this.invert ? 'linear-gradient(#0000, #0000)' : 'none';
        st.webkitMaskImage = st.maskImage = v;
      }
    }

    const stage = document.getElementById('stage');
    const layerBg = new MorphTrailLayer(document.getElementById('layer-bg'), false);
    const layerTop = new MorphTrailLayer(document.getElementById('layer-top'), true);

    let fw = 1, fh = 1;
    const syncSize = () => {
      const r = flower.getBoundingClientRect();
      fw = r.width || 1; fh = r.height || 1;
      layerBg.resize(fw, fh); layerTop.resize(fw, fh);
    };
    new ResizeObserver(syncSize).observe(flower);
    window.addEventListener('resize', syncSize);
    syncSize();

    const points = [];
    let hovering = false, headRadius = 0, time = 0, raf = 0;
    const mouse = { x: 0, y: 0 };
    const headSeed = Math.random() * 100;
    let lastSample = null;

    const toFlowerSpace = e => {
      const r = flower.getBoundingClientRect();
      const sx = fw / (r.width || 1), sy = fh / (r.height || 1);
      mouse.x = (e.clientX - r.left) * sx;
      mouse.y = (e.clientY - r.top) * sy;
    };

    function frame() {
      const targetR = hovering ? TRAIL_HEAD_R : 0;
      headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);
      if (hovering && headRadius > 5) {
        const d = lastSample ? Math.hypot(mouse.x - lastSample.x, mouse.y - lastSample.y) : Infinity;
        if (d > TRAIL_SAMPLE_DIST) {
          points.push({ x: mouse.x, y: mouse.y, r: headRadius, alpha: 1, seed: Math.random() * 100 });
          if (points.length > TRAIL_MAX_POINTS) points.splice(0, points.length - TRAIL_MAX_POINTS);
          lastSample = { x: mouse.x, y: mouse.y };
        }
      }
      for (let i = points.length - 1; i >= 0; i--) {
        const p = points[i];
        p.alpha *= TRAIL_FADE_SPEED; p.r *= 0.995;
        if (p.alpha < 0.01) points.splice(i, 1);
      }
      time += 0.016;
      const head = headRadius > 2 ? { x: mouse.x, y: mouse.y, r: headRadius, seed: headSeed } : null;
      if (points.length || head) {
        layerBg.render(points, head, time);
        layerTop.render(points, head, time);
        raf = requestAnimationFrame(frame);
      } else {
        layerBg.idle(); layerTop.idle();
        headRadius = 0; lastSample = null; raf = 0;
      }
    }
    const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };

    stage.addEventListener('mouseenter', e => { hovering = true; toFlowerSpace(e); wake(); });
    stage.addEventListener('mousemove', e => { hovering = true; toFlowerSpace(e); wake(); });
    stage.addEventListener('mouseleave', () => { hovering = false; wake(); });

    /* Mobile menu */
    const burger = document.getElementById('burger');
    const scrim = document.getElementById('scrim');
    const sheet = document.getElementById('sheet');
    const focusables = () => Array.from(sheet.querySelectorAll('a[href]'));
    let open = false;
    const setOpen = v => {
      open = v;
      document.body.classList.toggle('is-open', v);
      burger.setAttribute('aria-expanded', String(v));
      burger.setAttribute('aria-label', v ? 'Close menu' : 'Open menu');
      if (v) { sheet.removeAttribute('inert'); scrim.tabIndex = 0; focusables()[0]?.focus(); }
      else { sheet.setAttribute('inert', ''); scrim.tabIndex = -1; burger.focus(); }
    };
    burger.addEventListener('click', () => setOpen(!open));
    scrim.addEventListener('click', () => setOpen(false));
    sheet.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => {
      if (!open) return;
      if (e.key === 'Escape') { e.preventDefault(); setOpen(false); return; }
      if (e.key === 'Tab') {
        const f = focusables(); if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
      }
    });
    const mq = window.matchMedia('(max-width: 900px), (max-aspect-ratio: 4 / 5)');
    mq.addEventListener('change', () => { if (!mq.matches && open) setOpen(false); });
  })();
  </script>
</body>
</html>
