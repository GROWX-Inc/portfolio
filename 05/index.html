<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Quiet Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<script>
const HERO_IMAGE = "hero.jpg";

const RIPPLE_MAX      = 12;    // 同時に保持する波紋の数
const RIPPLE_RADIUS   = 0.18;  // 波紋の最大半径（画面幅比）
const RIPPLE_SPEED    = 0.9;   // 広がる速さ
const RIPPLE_DECAY    = 1.6;   // 減衰の速さ（大きいほど早く消える）
const RIPPLE_STRENGTH = 0.012; // 歪みの強さ
const RIPPLE_FREQ     = 60.0;  // 波の細かさ
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Poppins",Arial,Helvetica,sans-serif;
  color:#fff;
  background:#000;
  position:relative;width:100vw;height:100vh;
}
#hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#hero-img.ready{display:block}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.txt{text-shadow:rgba(0,0,0,.35) 0 2px 12px}
nav{position:absolute;top:32px;left:0;right:0;height:40px;z-index:2}
.logo{position:absolute;left:60px;top:50%;transform:translateY(-50%);display:flex}
.logo svg{width:32px;height:32px;filter:drop-shadow(rgba(0,0,0,.35) 0 2px 12px)}
.menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:8px}
.menu a{background:#fff;color:#000;border-radius:6px;padding:6px 12px;font-size:15px;text-decoration:none;line-height:1.3;white-space:nowrap}
.contact{position:absolute;right:55px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border-radius:8px;padding:8px 16px;font-size:15px;text-decoration:none;line-height:1.3}
.burger{display:none;position:absolute;right:24px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:0;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;z-index:4}
.burger span{display:block;width:18px;height:2px;background:#000;border-radius:1px}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,8,6,.94);z-index:3;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.overlay a{color:#fff;text-decoration:none;font-size:28px;font-weight:300}
.overlay .contact{position:static;transform:none;background:#fff;color:#000;font-size:18px;padding:12px 24px}
body.menu-open .overlay{display:flex}
h1{position:absolute;left:55px;top:32%;font-size:clamp(40px,5.2vw,72px);font-weight:300;line-height:1.15;z-index:2}
.desc{position:absolute;left:58%;bottom:14%;max-width:520px;z-index:2}
.desc p{font-size:18px;font-weight:500;line-height:1.35}
.ja{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
h1 .tag{display:block;font-size:clamp(16px,1.3vw,20px);font-weight:400;letter-spacing:0.08em;margin-top:20px}
.desc p.ja{font-size:16px;line-height:1.7}
.cta{display:inline-block;margin-top:24px;background:#fff;color:#000;border-radius:8px;padding:12px 16px;font-weight:600;font-size:16px;text-decoration:none;text-shadow:none}
@media (max-width:900px){
  .menu,.contact.top{display:none}
  .burger{display:flex}
  .logo{left:24px}
  h1{left:24px;right:24px}
  .desc{left:24px;right:24px;max-width:none}
}
</style>
</head>
<body>
<img id="hero-img" alt="">
<canvas id="gl"></canvas>

<nav>
  <a class="logo" href="#" aria-label="Home">
    <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
      <rect x="3" y="8" width="26" height="18" rx="4"/>
      <circle cx="16" cy="17" r="5.5"/>
      <path d="M11 8l2-3h6l2 3"/>
    </svg>
  </a>
  <div class="menu">
  </div>
  <a class="contact top ja" href="#">お問い合わせ</a>
  <button class="burger" aria-label="Menu" onclick="document.body.classList.toggle('menu-open')"><span></span><span></span><span></span></button>
</nav>

<div class="overlay" onclick="document.body.classList.remove('menu-open')">
  <a class="contact ja" href="#">お問い合わせ</a>
</div>

<h1 class="txt">A Quiet Escape,<br>Beautifully Designed<span class="tag ja">静けさに、身をゆだねる。</span></h1>

<div class="desc">
  <p class="txt ja">自然に寄り添うために設計された、静かな空間。<br>丁寧に考え抜かれた建築と、心静まる庭、<br>時を超える日本の美意識に触れてください。</p>
  <a class="cta ja" href="#">空間を見る</a>
</div>

<script>
(function(){
  const img = document.getElementById('hero-img');
  const canvas = document.getElementById('gl');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  img.addEventListener('load', () => { img.classList.add('ready'); if (!reduced) startGL(); });
  img.addEventListener('error', () => { img.classList.remove('ready'); canvas.style.display = 'none'; });
  img.src = HERO_IMAGE;

  function startGL(){
    const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false });
    if (!gl) return;

    const vs = `attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0.,1.);}`;
    const fs = `precision highp float;
      varying vec2 v;
      uniform sampler2D tex;
      uniform vec2 res, imgRes;
      uniform float time;
      uniform vec2 rc[${RIPPLE_MAX}];
      uniform float rt[${RIPPLE_MAX}];
      void main(){
        float asp = res.x/res.y;
        vec2 q = vec2(v.x*asp, v.y);
        vec2 off = vec2(0.);
        for(int i=0;i<${RIPPLE_MAX};i++){
          float age = time - rt[i];
          if(rt[i] < 0. || age < 0.) continue;
          vec2 c = vec2(rc[i].x*asp, rc[i].y);
          vec2 d = q - c;
          float dist = length(d);
          float R = ${RIPPLE_RADIUS.toFixed(4)} * asp;
          float front = age * ${RIPPLE_SPEED.toFixed(4)} * R;
          float env = exp(-age*${RIPPLE_DECAY.toFixed(4)});
          float ring = 1. - smoothstep(0., R, abs(dist-front));
          float spatial = 1. - smoothstep(0., R, dist);
          float w = sin(dist*${RIPPLE_FREQ.toFixed(2)} - age*${RIPPLE_SPEED.toFixed(4)}*6.);
          off += (dist>1e-4 ? d/dist : vec2(0.)) * w * env * ring * spatial * ${RIPPLE_STRENGTH.toFixed(5)};
        }
        vec2 uv = v + off;
        // object-fit: cover
        float ca = res.x/res.y, ia = imgRes.x/imgRes.y;
        vec2 s = vec2(1.), o = vec2(0.);
        if(ca > ia){ s.y = ia/ca; o.y = (1.-s.y)*.5; } else { s.x = ca/ia; o.x = (1.-s.x)*.5; }
        uv = uv*s + o;
        gl_FragColor = texture2D(tex, clamp(uv, 0., 1.));
      }`;
    const sh = (t, s) => { const h = gl.createShader(t); gl.shaderSource(h, s); gl.compileShader(h); return h; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.display = 'none'; return; }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);

    const uRes = gl.getUniformLocation(prog, 'res');
    const uImg = gl.getUniformLocation(prog, 'imgRes');
    const uTime = gl.getUniformLocation(prog, 'time');
    const uRc = gl.getUniformLocation(prog, 'rc');
    const uRt = gl.getUniformLocation(prog, 'rt');
    gl.uniform2f(uImg, img.naturalWidth, img.naturalHeight);

    const centers = new Float32Array(RIPPLE_MAX * 2);
    const times = new Float32Array(RIPPLE_MAX).fill(-1);
    let head = 0, lastX = -1, lastY = -1, lastT = 0;
    const t0 = performance.now();
    const now = () => (performance.now() - t0) / 1000;

    function addRipple(cx, cy){
      const t = now();
      const dx = cx - lastX, dy = cy - lastY;
      if (lastX >= 0 && dx*dx + dy*dy < 0.0002 && t - lastT < 0.05) return;
      lastX = cx; lastY = cy; lastT = t;
      centers[head*2] = cx; centers[head*2+1] = cy; times[head] = t;
      head = (head + 1) % RIPPLE_MAX;
    }
    const onMove = (x, y) => addRipple(x / innerWidth, y / innerHeight);
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });

    function resize(){
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function frame(){
      gl.uniform1f(uTime, now());
      gl.uniform2fv(uRc, centers);
      gl.uniform1fv(uRt, times);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    frame();
  }
})();
</script>
</body>
</html>
