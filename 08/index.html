<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethera — Beyond silence, we build the eternal.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
<script>
const HERO_VIDEO = "hero.mp4";
</script>
<style>
:root { --brand: #F2C300; --brand-deep: #B8900A; --brand-pale: #FFF6CC; }
html, body { margin: 0; padding: 0; background: #ffffff; }
a { color: #111; text-decoration: none; }
a:hover { color: #6b6b6b; }
button { font-family: 'Inter', Arial, sans-serif; }
.stage { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #ffffff; font-family: 'Inter', Arial, sans-serif; }
.video { position: absolute; left: 0; right: 0; bottom: 0; height: 68vh; z-index: 0; opacity: 0; animation: riseIn 0.7s ease-out 0.3s forwards; }
.video video { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
.video .fade { position: absolute; inset: 0; background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0) 45%); }
nav { position: absolute; top: 28px; left: 0; right: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; opacity: 0; animation: riseIn 0.7s ease-out 0s forwards; }
.logo { font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: 22px; color: #000; letter-spacing: -0.01em; }
.logo sup { font-size: 0.5em; vertical-align: super; color: var(--brand-deep); }
.navlinks { display: flex; align-items: center; gap: 32px; font-size: 14px; }
.navlinks a { color: #6b6b6b; }
.navlinks a.current { color: #000; border-bottom: 2px solid var(--brand); padding-bottom: 2px; }
.cta { background: var(--brand); color: #111111; border: none; border-radius: 999px; padding: 10px 22px; font-size: 13px; cursor: pointer; transition: transform 0.2s ease, background 0.2s ease; }
.cta:hover { transform: scale(1.03); background: #FFD633; }
.burger { display: none; width: 40px; height: 40px; border-radius: 999px; background: #000; border: none; cursor: pointer; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
.burger span { display: block; width: 16px; height: 1.5px; background: #fff; }
.menu { position: absolute; inset: 0; z-index: 3; background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.menu.open { display: flex; }
.menu .close { position: absolute; top: 28px; right: 24px; width: 40px; height: 40px; border-radius: 999px; background: #000; color: #fff; border: none; font-size: 18px; cursor: pointer; }
.menu a { font-size: 24px; color: #6b6b6b; }
.menu a.current { color: #000; }
.menu .cta-big { background: #000; color: #fff; border: none; border-radius: 999px; padding: 14px 36px; font-size: 15px; cursor: pointer; margin-top: 12px; }
.hero { position: absolute; top: 14%; left: 0; right: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 60px; }
.hero h1 { margin: 0; font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: clamp(40px, 5.6vw, 76px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; color: #111; white-space: nowrap; max-width: 1400px; opacity: 0; animation: riseIn 0.7s ease-out 0.15s forwards; }
.hero h1 em { font-style: normal; color: var(--brand-deep); }
.tagline { margin: 20px 0 8px 0; font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 15px; font-weight: 400; letter-spacing: 0.2em; color: var(--brand-deep); text-align: center; opacity: 0; animation: riseIn 0.7s ease-out 0.1s forwards; }
.desc { margin: 40px 0 0 0; font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 16px; color: #6F6F6F; line-height: 1.7; max-width: 620px; opacity: 0; animation: riseIn 0.7s ease-out 0.3s forwards; }
.desc .en { font-family: 'Inter', Arial, sans-serif; }
.hero .cta-main { margin-top: 44px; background: var(--brand); color: #111111; border: none; border-radius: 999px; padding: 18px 52px; font-size: 15px; font-weight: 500; cursor: pointer; opacity: 0; animation: riseIn 0.7s ease-out 0.45s forwards; transition: transform 0.2s ease, background 0.2s ease; }
.hero .cta-main:hover { transform: scale(1.03); background: #FFD633; }
@keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 900px) {
  .navlinks, .cta { display: none; }
  .burger { display: flex; }
  .hero { padding-left: 24px; padding-right: 24px; }
  .hero h1 { white-space: normal; }
  .video { height: 50vh; }
}
</style>
</head>
<body>
<div class="stage">

  <div class="video">
    <video id="hero-video" autoplay muted loop playsinline></video>
    <div class="fade"></div>
  </div>

  <nav>
    <div class="logo">Aethera<sup>®</sup></div>
    <div class="navlinks">
      <a href="#" class="current">Home</a>
      <a href="#">Studio</a>
      <a href="#">About</a>
      <a href="#">Journal</a>
      <a href="#">Reach Us</a>
    </div>
    <button class="cta">Begin Journey</button>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <div class="menu" id="menu">
    <button class="close" id="menu-close" aria-label="Close">×</button>
    <a href="#" class="current">Home</a>
    <a href="#">Studio</a>
    <a href="#">About</a>
    <a href="#">Journal</a>
    <a href="#">Reach Us</a>
    <button class="cta-big">Begin Journey</button>
  </div>

  <div class="hero">
    <h1>Beyond <em>silence,</em> we build <em>the eternal.</em></h1>
    <p class="tagline">風景を、設計する。</p>
    <p class="desc"><span class="en">Aethera</span> は、庭・公園・建築外構をてがけるランドスケープデザインスタジオ。<br>土地の記憶に耳を澄まし、時とともに育つ風景を設計します。</p>
    <button class="cta-main">Begin Journey</button>
  </div>

</div>
<script>
(function(){
  var v = document.getElementById('hero-video');
  v.src = HERO_VIDEO;
  v.muted = true; v.loop = true;
  var p = v.play(); if (p && p.catch) p.catch(function(){});
  var menu = document.getElementById('menu');
  var toggle = function(){ menu.classList.toggle('open'); };
  document.getElementById('burger').addEventListener('click', toggle);
  document.getElementById('menu-close').addEventListener('click', toggle);
  menu.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', toggle); });
})();
</script>
</body>
</html>
